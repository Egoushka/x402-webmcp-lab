<!doctype html><meta charset="utf-8"><title>cartoon shop</title>
<style>
@font-face{font-family:Fredoka;font-weight:700;src:url(../fonts/fredoka-latin-700-normal.woff2)}
@font-face{font-family:Fredoka;font-weight:500;src:url(../fonts/fredoka-latin-500-normal.woff2)}
html,body{margin:0;background:#cdeeff}svg{display:block;width:1080px;height:1350px}
text{font-family:Fredoka,sans-serif;font-weight:700;text-anchor:middle}

<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
<rect width="1080" height="1350" fill="#cdeeff"/>
<g id="cloud1" fill="#fff"><ellipse cx="0" cy="0" rx="110" ry="42"/><ellipse cx="-50" cy="-30" rx="55" ry="45"/><ellipse cx="40" cy="-40" rx="62" ry="52"/></g>
<g id="cloud2" fill="#fff"><ellipse cx="0" cy="0" rx="90" ry="34"/><ellipse cx="-34" cy="-24" rx="44" ry="36"/><ellipse cx="30" cy="-30" rx="50" ry="42"/></g>
<rect x="0" y="1080" width="1080" height="90" fill="#8fe3a0"/><rect x="0" y="1080" width="1080" height="14" fill="#6fcf86"/>

<!-- shop -->
<g id="shop">
 <rect x="660" y="395" width="280" height="118" rx="22" fill="#ffd23f" stroke="#1d1d3a" stroke-width="8"/>
 <text x="800" y="480" font-size="74" fill="#1d1d3a">Quotes</text>
 <rect x="580" y="600" width="440" height="480" fill="#fff4dc" stroke="#1d1d3a" stroke-width="8"/>
 <rect x="632" y="612" width="336" height="268" rx="18" fill="#3a3670" stroke="#1d1d3a" stroke-width="8"/>
 <g id="keeper">
  <circle cx="800" cy="716" r="64" fill="#ffcfa0" stroke="#1d1d3a" stroke-width="8"/>
  <path d="M732 700 Q800 610 868 700 Z" fill="#ff5d73" stroke="#1d1d3a" stroke-width="8" stroke-linejoin="round"/>
  <circle cx="778" cy="722" r="8" fill="#1d1d3a"/><circle cx="822" cy="722" r="8" fill="#1d1d3a"/>
  <path d="M776 744 Q800 766 824 744" fill="none" stroke="#1d1d3a" stroke-width="7" stroke-linecap="round"/>
  <path id="stache" d="M770 738 Q800 726 830 738" fill="none" stroke="#1d1d3a" stroke-width="0"/>
 </g>
 <rect x="600" y="880" width="400" height="56" rx="12" fill="#c77d3a" stroke="#1d1d3a" stroke-width="8"/>
 <ellipse cx="690" cy="880" rx="46" ry="12" fill="#e9a23b" stroke="#1d1d3a" stroke-width="6"/>
 <rect x="640" y="960" width="320" height="86" rx="18" fill="#ffe9b8" stroke="#1d1d3a" stroke-width="6"/>
 <text x="800" y="1022" font-size="56" fill="#c77d3a">open</text>
 <!-- awning -->
 <g stroke="#1d1d3a" stroke-width="8" stroke-linejoin="round">
  <path d="M556 530 H1044 L1020 620 H580 Z" fill="#ff5d73"/>
 </g>
 <g fill="#fff"><rect x="634" y="534" width="54" height="82"/><rect x="742" y="534" width="54" height="82"/><rect x="850" y="534" width="54" height="82"/><rect x="958" y="534" width="40" height="82"/></g>
 <path d="M556 530 H1044 L1020 620 H580 Z" fill="none" stroke="#1d1d3a" stroke-width="8" stroke-linejoin="round"/>
 <g fill="#ff5d73" stroke="#1d1d3a" stroke-width="8"><circle cx="640" cy="622" r="0"/></g>
</g>
<g id="board" transform="translate(800,780) scale(0)">
 <rect x="-170" y="-96" width="340" height="190" rx="26" fill="#ff4d5e" stroke="#1d1d3a" stroke-width="8"/>
 <text x="0" y="14" font-size="118" fill="#fff">402</text>
 <text x="0" y="68" font-size="42" fill="#fff">pay 0.01 USDC</text>
 <circle cx="-120" cy="-100" r="16" fill="#ffb703" stroke="#1d1d3a" stroke-width="6"/><circle cx="120" cy="-100" r="16" fill="#ffb703" stroke="#1d1d3a" stroke-width="6"/>
</g>
<g id="answer" transform="translate(800,780) scale(0)">
 <rect x="-170" y="-96" width="340" height="190" rx="26" fill="#3ecf8e" stroke="#1d1d3a" stroke-width="8"/>
 <text x="0" y="-18" font-size="54" fill="#fff">ETH</text>
 <text x="0" y="66" font-size="104" fill="#1d1d3a">1225</text>
</g>

<!-- robot -->
<g id="robot" transform="translate(-300,1080)">__ROBOT__</g>
<g id="bubble" transform="translate(330,640) scale(0)">
 <path d="M-200 -100 H200 Q230 -100 230 -72 V-28 Q230 0 200 0 H50 L36 42 L10 0 H-200 Q-230 0 -230 -28 V-72 Q-230 -100 -200 -100 Z" fill="#fff" stroke="#1d1d3a" stroke-width="8" stroke-linejoin="round"/>
 <text x="0" y="-32" font-size="56" fill="#1d1d3a">Quote, please!</text>
</g>
<g id="coin" transform="translate(0,0) scale(0)"><g id="coinspin"><circle r="36" fill="#ffd23f" stroke="#1d1d3a" stroke-width="8"/><text y="16" font-size="46" fill="#c77d3a">$</text></g></g>
<g id="spark" opacity="0"><g fill="#ffd23f" stroke="#1d1d3a" stroke-width="5" stroke-linejoin="round"><path d="M0 -50 L12 -12 L50 0 L12 12 L0 50 L-12 12 L-50 0 L-12 -12Z"/></g></g>
<g id="cardheld" transform="translate(0,0) scale(0)">
 <rect x="-170" y="-96" width="340" height="190" rx="26" fill="#3ecf8e" stroke="#1d1d3a" stroke-width="8"/>
 <text x="0" y="-18" font-size="54" fill="#fff">ETH</text>
 <text x="0" y="66" font-size="104" fill="#1d1d3a">1225</text>
</g>

<!-- chain -->
<rect x="0" y="1170" width="1080" height="180" fill="#23244a"/>
<text x="60" y="1226" font-size="40" fill="#9fb3ff" style="text-anchor:start">test chain</text>
<g id="blocks" font-size="44">
 <rect x="60" y="1244" width="220" height="78" rx="18" fill="#3b3d7a"/><text x="170" y="1297" fill="#c9d2ff">#41</text>
 <rect x="320" y="1244" width="220" height="78" rx="18" fill="#3b3d7a"/><text x="430" y="1297" fill="#c9d2ff">#42</text>
 <rect x="580" y="1244" width="220" height="78" rx="18" fill="#3b3d7a"/><text x="690" y="1297" fill="#c9d2ff">#43</text>
 <rect x="840" y="1244" width="180" height="78" rx="18" fill="none" stroke="#5a5da8" stroke-width="6" stroke-dasharray="14 12"/>
 <g id="newblock" transform="translate(930,1283) scale(0)"><rect x="-96" y="-39" width="192" height="78" rx="18" fill="#ffd23f" stroke="#fff" stroke-width="5"/><text x="0" y="13" fill="#1d1d3a" font-size="42">+0.01</text></g>
</g>

<!-- caption + timer -->
<g id="caps" font-size="84" fill="#1d1d3a"><text id="c1" x="540" y="120"></text><text id="c2" x="540" y="212"></text></g>
<g id="timer" transform="translate(50,250)">
 <rect width="390" height="150" rx="34" fill="#fff" stroke="#1d1d3a" stroke-width="8"/>
 <text id="tnum" x="195" y="88" font-size="82" fill="#1d1d3a">0 ms</text>
 <text x="195" y="130" font-size="34" fill="#6b6a8c" style="font-weight:500">slow-mo timer</text>
</g>

<!-- final card -->
<g id="final" transform="translate(0,1350)">
 <rect width="1080" height="1350" fill="#23244a"/>
 <circle cx="540" cy="330" r="270" fill="#3b3d7a"/>
 <g id="frobot" transform="translate(540,590) scale(1.05)">__ROBOT2__</g>
 <g id="fcard" transform="translate(540,470) scale(0)"><rect x="-170" y="-96" width="340" height="190" rx="26" fill="#3ecf8e" stroke="#1d1d3a" stroke-width="8"/><text x="0" y="-18" font-size="54" fill="#fff">ETH</text><text x="0" y="66" font-size="104" fill="#1d1d3a">1225</text></g>
 <text id="f262" x="540" y="860" font-size="230" fill="#ffd23f">262 ms</text>
 <text id="f1" x="540" y="975" font-size="86" fill="#fff">No human.</text>
 <text id="f2" x="540" y="1070" font-size="86" fill="#fff">No API key.</text>
 <g id="fnote"><rect x="250" y="1120" width="580" height="78" rx="39" fill="#ffd23f"/><text x="540" y="1176" font-size="46" fill="#1d1d3a">test chain, test money</text></g>
 <text id="furl" x="540" y="1284" font-size="46" fill="#c9d2ff" style="font-weight:500">github.com/Egoushka/x402-webmcp-lab</text>
</g>
</svg>
<script>
const $ = (id) => document.getElementById(id);
const cl = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const pr = (t, a, b) => cl((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const outCubic = (k) => 1 - Math.pow(1 - k, 3);
const inOut = (k) => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const outBack = (k) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const inBack = (k) => { const c1 = 1.7; return (c1 + 1) * k * k * k - c1 * k * k; };
const bell = (k) => Math.sin(Math.PI * cl(k));
const set = (id, tr) => $(id).setAttribute('transform', tr);
const CAPS = [[0, ['An AI agent', 'goes shopping.']], [2.2, ['It asks the shop', 'for a quote.']], [4.0, ['402: pay first.', '']], [5.8, ['It pays.', 'No human.']], [7.7, ['Paid. Answer', 'in hand.']]];
const T_END = 14.7, T_ASK = 2.4, T_DONE = 7.75;

function walkPose(p, ph, amp) {
  const s = Math.sin(ph) * amp;
  set(p + '-legL', `translate(-38,-92) rotate(${s})`); set(p + '-legR', `translate(38,-92) rotate(${-s})`);
  set(p + '-armL', `translate(-80,-215) rotate(${-s * .9})`); set(p + '-armR', `translate(80,-215) rotate(${s * .9})`);
}
function blink(p, t, off) { const k = ((t + off) % 3.1); const c = k > 2.95 ? 0.1 : 1; set(p + '-eyes', `translate(0,-8) scale(1,${c}) translate(0,8)`); }
function mouth(p, surprised) { $(p + '-smile').style.display = surprised ? 'none' : ''; $(p + '-oh').style.display = surprised ? '' : 'none'; }

function render(t) {
  // clouds
  set('cloud1', `translate(${(160 + t * 14) % 1400 - 150},330)`); set('cloud2', `translate(${(900 + t * 9) % 1400 - 150},470)`);

  // captions, pop-in on every change
  let ci = 0; CAPS.forEach((c, i) => { if (t >= c[0]) ci = i; });
  const cs = t - CAPS[ci][0], sc = lerp(.6, 1, outBack(cl(cs / .35)));
  const capOut = pr(t, 10.2, 10.5);
  ['c1', 'c2'].forEach((id, k) => { const e = $(id); e.textContent = CAPS[ci][1][k]; e.setAttribute('opacity', 1 - capOut);
    const y = k ? 212 : (CAPS[ci][1][1] ? 120 : 165); e.setAttribute('transform', `translate(540,${y}) scale(${sc}) translate(-540,${-y})`); });

  // shop squash + bounce when the robot arrives, and when paid
  const shopB = bell(pr(t, 1.7, 2.1)) * .03 + bell(pr(t, 7.2, 7.6)) * .035;
  set('shop', `translate(800,1080) scale(${1 + shopB * .5},${1 - shopB}) translate(-800,-1080)`);
  // keeper bob
  set('keeper', `translate(0,${Math.sin(t * 5) * 3 - bell(pr(t, 3.9, 4.4)) * 18 - bell(pr(t, 7.6, 8.3)) * 14})`);

  // robot position
  let x, sx = 1, walking = false;
  if (t < 1.8) { x = lerp(-240, 300, outCubic(pr(t, 0, 1.8))); walking = true; }
  else if (t < 9.0) x = 300;
  else if (t < 9.45) x = 300;
  else { x = lerp(300, -380, inOut(pr(t, 9.45, 10.9))); walking = t < 10.9; }
  if (t >= 9.0) { const k = pr(t, 9.0, 9.4); sx = k < .5 ? lerp(1, .05, k * 2) : lerp(.05, -1, (k - .5) * 2); }
  const ph = t * 13, hop = walking ? -Math.abs(Math.sin(ph * .5)) * 18 : 0;
  const arrive = bell(pr(t, 1.75, 2.15)) * .1, jump = -bell(pr(t, 5.55, 5.9)) * 0 - bell(pr(t, 7.2, 7.7)) * 40 - bell(pr(t, 8.9, 9.4)) * 26;
  set('robot', `translate(${x},${1080 + hop + jump}) scale(${sx * (1 + arrive * .6) * 1.1},${(1 - arrive) * 1.1})`);
  walkPose('r', ph, walking ? 28 : 0);
  if (!walking) { set('r-legL', 'translate(-38,-92)'); set('r-legR', 'translate(38,-92)'); }
  // arms
  let armR = walking ? Math.sin(ph) * 25 : Math.sin(t * 3) * 3, armL = walking ? -Math.sin(ph) * 25 : -3;
  if (!walking || t < 1.8) {
    if (t > 2.0 && t < 2.8) armR = -lerp(0, 120, outBack(pr(t, 2.0, 2.4))) * (1 - pr(t, 2.55, 2.8)) + Math.sin(t * 20) * 6 * bell(pr(t, 2.3, 2.8)); // wave
    // pay: raise with coin, throw
    if (t >= 5.7 && t < 7.1) {
      const up = outBack(pr(t, 5.7, 6.1)), th = pr(t, 6.35, 6.6);
      armR = -lerp(90, 140, up) * (1 - th) - 90 * th; if (t < 5.7) armR = 0;
      if (t >= 5.7 && t < 6.1) armR = -140 * outBack(pr(t, 5.7, 6.1));
      if (t >= 6.35) armR = -lerp(140, 95, outCubic(pr(t, 6.35, 6.6)));
      if (t >= 6.9) armR = -lerp(95, 0, outCubic(pr(t, 6.9, 7.2)));
    }
    if (t >= 8.0 && t < 9.0) { armR = -100 * bell(pr(t, 8.0, 8.6)) ; armL = 100 * bell(pr(t, 8.0, 8.6)); }
  }
  if (t >= 9.0 && walking) { armR = Math.sin(ph) * 12 - 60; armL = -Math.sin(ph) * 12 + 60; }
  if (t >= 9.0 && !walking) { armR = -60; armL = 60; }
  set('r-armR', `translate(80,-215) rotate(${armR})`); set('r-armL', `translate(-80,-215) rotate(${armL})`);
  // head tilt
  const happy = t >= 7.2 && t < 9.0 ? Math.sin(t * 14) * 5 : 0;
  set('r-head', `translate(0,${-330 + Math.sin(t * 4) * 2}) rotate(${happy})`);
  mouth('r', t >= 4.0 && t < 5.7); blink('r', t, 0.3);

  // bubble
  const b = pr(t, 2.4, 2.8), bo = pr(t, 3.85, 4.05);
  set('bubble', `translate(${x + 40},535) scale(${outBack(b) * (1 - bo)})`);

  // board 402
  const bp = t < 5.6 ? outBack(pr(t, 4.0, 4.5)) : 1 - inBack(pr(t, 5.6, 5.9));
  const wob = t >= 4.5 && t < 5.6 ? Math.sin(t * 9) * 2 : 0;
  const flip = pr(t, 7.75, 7.95);
  set('board', `translate(800,780) rotate(${wob}) scale(${(t < 7.75 ? bp : 0) || 0},${(t < 7.75 ? bp : 0) || 0})`);
  // answer card at the shop, flips in, then flies to the robot
  let ax = 800, ay = 780, as = 0, ar = 0;
  if (t >= 7.9 && t < 8.3) as = outBack(pr(t, 7.9, 8.25));
  if (t >= 8.3) { const k = inOut(pr(t, 8.3, 8.95)); ax = lerp(800, 320 + 0, k); ay = lerp(780, 900, k) - bell(k) * 90; as = lerp(1, .62, k); ar = bell(k) * -10; }
  if (t < 8.95) set('answer', `translate(${ax},${ay}) rotate(${ar}) scale(${as})`); else set('answer', 'translate(800,780) scale(0)');
  // held card follows the robot (stays upright, not mirrored)
  const held = t >= 8.95 ? 1 : 0;
  set('cardheld', `translate(${x + (sx < 0 ? -8 : 8) * 0},${1080 + hop + jump - 200}) scale(${.62 * held * (t >= 8.95 ? 1 + bell(pr(t, 8.95, 9.25)) * .12 : 1)})`);

  // coin
  let cx = 0, cy = 0, cs2 = 0, spin = 0;
  if (t >= 5.9 && t < 6.35) { cx = 479; cy = 736; cs2 = outBack(pr(t, 5.9, 6.15)); spin = 0; }
  else if (t >= 6.35 && t < 7.15) { const k = pr(t, 6.35, 7.15); cx = lerp(479, 690, k); cy = lerp(736, 862, k * k) - 4 * 170 * k * (1 - k); cs2 = 1; spin = k * 1500; }
  else if (t >= 7.15 && t < 7.55) { const k = pr(t, 7.15, 7.55); cx = 690; cy = 862 - bell(k * 1) * 26; cs2 = 1 - inBack(pr(t, 7.35, 7.55)) * 1; spin = 0; }
  set('coin', `translate(${cx},${cy}) scale(${Math.max(0, cs2)})`); set('coinspin', `scale(${Math.abs(Math.cos(spin * Math.PI / 180))},1)`);
  // spark
  const sp = pr(t, 7.15, 7.6); $('spark').setAttribute('opacity', sp > 0 && sp < 1 ? 1 : 0); set('spark', `translate(690,850) scale(${1.4 * Math.sin(sp * Math.PI)}) rotate(${sp * 90})`);
  // chain block
  const nb = pr(t, 7.25, 7.7);
  set('newblock', `translate(930,${1283 - (1 - outBack(nb)) * 150}) scale(${nb > 0 ? 1 : 0})`);

  // timer
  const k = pr(t, T_ASK, T_DONE), val = Math.round(262 * k);
  $('tnum').textContent = val + ' ms'; $('tnum').setAttribute('fill', t >= T_DONE ? '#1faa6e' : '#1d1d3a');
  const tp = (t > 10.5) ? 0 : 1; set('timer', `translate(50,250) scale(${tp ? 1 + bell(pr(t, T_DONE, T_DONE + .35)) * .12 : 0})`);

  // final card
  const f = pr(t, 10.55, 11.15); set('final', `translate(0,${1350 * (1 - outCubic(f))})`);
  const ft = t - 11.1;
  set('frobot', `translate(540,${600 + (ft < 0 ? 40 : 0) - Math.abs(Math.sin(ft * 5)) * (ft > 0 ? 16 : 0)}) scale(1.05)`);
  walkPose('f', 0, 0); set('f-legL', 'translate(-38,-92)'); set('f-legR', 'translate(38,-92)');
  set('f-armR', `translate(80,-215) rotate(${-150 + Math.sin(ft * 6) * 18})`); set('f-armL', `translate(-80,-215) rotate(${-60 * 0 + 20})`);
  set('f-head', `translate(0,-330) rotate(${Math.sin(ft * 3) * 4})`); blink('f', t, 1.1);
  set('fcard', `translate(${540},${450}) scale(${outBack(pr(t, 11.2, 11.6)) * .001 * 0})`);
  const pop = (a, y, id) => { const s = outBack(pr(t, a, a + .4)); set(id, `translate(540,${y}) scale(${s}) translate(-540,${-y})`); };
  pop(11.3, 860, 'f262'); pop(11.7, 975, 'f1'); pop(11.9, 1070, 'f2'); pop(12.3, 1160, 'fnote'); pop(12.6, 1284, 'furl');
}
window.render = render; window.T_END = T_END;
render(0);
</script>
